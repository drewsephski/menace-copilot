name: Desktop Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: desktop-release
    cancel-in-progress: false

jobs:
    release-macos:
        runs-on: macos-15
        timeout-minutes: 60
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Validate release version and tagged source
              env:
                  RELEASE_REF: ${{ github.ref }}
              run: |
                  node - <<'NODE'
                  const { version } = require('./package.json');
                  if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.RELEASE_REF !== `refs/tags/v${version}`) {
                    throw new Error('Run this workflow on a stable vX.Y.Z tag matching package.json');
                  }
                  NODE
            - run: pnpm run check
            - name: Import Developer ID certificate into temporary keychain
              env:
                  MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
                  MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: |
                  set -euo pipefail
                  for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
                    if [ -z "${!name}" ]; then echo "::error::Missing release secret: $name"; exit 1; fi
                  done
                  [ "$APPLE_TEAM_ID" = '2NHJGX6A7S' ]
                  certificate="$RUNNER_TEMP/menace-signing.p12"
                  keychain="$RUNNER_TEMP/menace-signing.keychain-db"
                  keychain_password="$(openssl rand -hex 32)"
                  printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
                  security create-keychain -p "$keychain_password" "$keychain"
                  security set-keychain-settings -lut 21600 "$keychain"
                  security unlock-keychain -p "$keychain_password" "$keychain"
                  security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
                  security list-keychains -d user -s "$keychain"
                  rm -f "$certificate"
                  security find-identity -v -p codesigning
            - name: Build signed and notarized Apple Silicon release
              env:
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  MENACE_HOSTED_API_BASE_URL: https://menace-agent.vercel.app/api
                  MENACE_LOCAL_AI_BINARIES_BASE_URL: ${{ vars.MENACE_LOCAL_AI_BINARIES_BASE_URL }}
              run: pnpm run beta:macos
            - name: Stage draft release, verify assets, then publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  version="$(node -p 'require("./package.json").version')"
                  tag="v$version"
                  gh release create "$tag" out/release/* --verify-tag --draft --title "Menace Agent $version" --notes-file docs/desktop-release-notes.md
                  download="$RUNNER_TEMP/release-verification"
                  mkdir -p "$download"
                  gh release download "$tag" --dir "$download"
                  (cd "$download" && shasum -a 256 -c SHA256SUMS)
                  gh release edit "$tag" --draft=false --latest
            - name: Preserve release artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: menace-agent-macos-release
                  path: out/release/*
                  if-no-files-found: error
            - name: Remove signing material
              if: always()
              run: |
                  security delete-keychain "$RUNNER_TEMP/menace-signing.keychain-db" || true
                  rm -f "$RUNNER_TEMP/menace-signing.p12"
