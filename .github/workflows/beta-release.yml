name: Beta Release

on:
    workflow_dispatch:
        inputs:
            skip_notarize:
                description: 'Skip notarization (local testing only)'
                required: false
                default: 'false'

jobs:
    beta-macos:
        runs-on: macos-latest
        env:
            MENACE_UPDATE_MANIFEST_URL: ${{ vars.MENACE_UPDATE_MANIFEST_URL }}
            MENACE_RELEASE_PAGE_URL: ${{ vars.MENACE_RELEASE_PAGE_URL }}
            MENACE_LOCAL_AI_BINARIES_BASE_URL: ${{ vars.MENACE_LOCAL_AI_BINARIES_BASE_URL }}
            MENACE_HOSTED_API_BASE_URL: ${{ vars.MENACE_HOSTED_API_BASE_URL }}
            APPLE_ID: ${{ secrets.APPLE_ID }}
            APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
            SKIP_NOTARIZE: ${{ inputs.skip_notarize == 'true' && '1' || '' }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm
            - run: npm ci
            - run: npm run check
            - name: Build notarized beta release (Apple Silicon)
              run: npm run beta:macos
            - name: Upload beta artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: menace-agent-macos-beta
                  path: |
                      out/make/**
                      out/Menace Agent-darwin-arm64/Menace Agent.app
