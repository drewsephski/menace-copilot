<!doctype html>
<html>
    <head>
        <meta http-equiv="content-security-policy" content="script-src 'self' 'unsafe-inline'" />
        <title>Menace Agent</title>
        <style>
            :root {
                /* Talent Autocue — matte hood, cream type, red tally */
                --bg-app: #0b0b0b;
                --bg-surface: #121212;
                --bg-elevated: #1a1a1a;
                --bg-hover: #222222;

                --text-primary: #f7f7f2;
                --text-secondary: #a8a89e;
                --text-muted: #5c5c56;

                --border: rgba(247, 247, 242, 0.08);
                --border-strong: rgba(247, 247, 242, 0.14);

                --accent: #c41e3a;
                --accent-hover: #a81830;
                --tally: #c41e3a;
                --tally-hover: #a81830;
                --tally-dim: #3a151c;
                --tally-glow: rgba(196, 30, 58, 0.35);

                --success: #5aab6e;
                --warning: #d4a017;
                --danger: #c41e3a;

                --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
                --font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
                --font-size-xs: 11px;
                --font-size-sm: 13px;
                --font-size-base: 14px;
                --font-size-lg: 16px;
                --font-size-xl: 22px;
                --font-size-2xl: 32px;
                --font-size-prompter: 20px;
                --font-weight-normal: 400;
                --font-weight-medium: 500;
                --font-weight-semibold: 600;
                --line-height: 1.55;
                --line-height-prompter: 1.45;

                --space-xs: 4px;
                --space-sm: 8px;
                --space-md: 16px;
                --space-lg: 24px;
                --space-xl: 40px;
                --space-2xl: 64px;

                --radius-sm: 2px;
                --radius-md: 2px;
                --radius-lg: 3px;
                --radius-hood: 3px;

                --transition: 150ms ease;

                --sidebar-width: 200px;
                --sidebar-width-collapsed: 60px;

                /* Legacy aliases */
                --background-transparent: transparent;
                --bg-primary: var(--bg-app);
                --bg-secondary: var(--bg-surface);
                --bg-tertiary: var(--bg-elevated);
                --text-color: var(--text-primary);
                --description-color: var(--text-secondary);
                --placeholder-color: var(--text-muted);
                --border-color: var(--border);
                --border-subtle: var(--border);
                --border-default: var(--border-strong);
                --header-background: var(--bg-surface);
                --header-actions-color: var(--text-secondary);
                --main-content-background: var(--bg-app);
                --button-background: transparent;
                --button-border: var(--border-strong);
                --icon-button-color: var(--text-secondary);
                --hover-background: var(--bg-hover);
                --input-background: var(--bg-elevated);
                --input-focus-background: var(--bg-elevated);
                --focus-border-color: var(--accent);
                --focus-box-shadow: transparent;
                --scrollbar-track: var(--bg-app);
                --scrollbar-thumb: var(--border-strong);
                --scrollbar-thumb-hover: #444444;
                --scrollbar-background: var(--bg-app);
                --start-button-background: var(--tally);
                --start-button-color: var(--text-primary);
                --start-button-border: transparent;
                --start-button-hover-background: var(--tally-hover);
                --start-button-hover-border: transparent;
                --text-input-button-background: var(--accent);
                --text-input-button-hover: var(--accent-hover);
                --link-color: var(--accent);
                --key-background: var(--bg-elevated);
                --success-color: var(--success);
                --warning-color: var(--warning);
                --error-color: var(--danger);
                --danger-color: var(--danger);
                --preview-video-background: var(--bg-surface);
                --preview-video-border: var(--border);
                --option-label-color: var(--text-primary);
                --screen-option-background: var(--bg-surface);
                --screen-option-hover-background: var(--bg-elevated);
                --screen-option-selected-background: var(--bg-hover);
                --screen-option-text: var(--text-secondary);

                --header-padding: 8px 16px;
                --header-font-size: 14px;
                --header-gap: 8px;
                --header-button-padding: 6px 12px;
                --header-icon-padding: 6px;
                --header-font-size-small: 12px;
                --main-content-padding: 16px;
                --main-content-margin-top: 0;
                --icon-size: 18px;
                --border-radius: var(--radius-sm);
                --content-border-radius: 0;
                --response-font-size: var(--font-size-prompter);
            }

            html {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
                border-radius: var(--radius-hood);
                background: transparent;
                color-scheme: dark;
            }

            body {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
                background: var(--bg-app);
                color: var(--text-primary);
                line-height: var(--line-height);
                border-radius: var(--radius-hood);
                border: none;
                font-family: var(--font);
                font-size: var(--font-size-base);
                font-weight: var(--font-weight-normal);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            * {
                box-sizing: border-box;
            }

            button {
                -webkit-appearance: none;
                appearance: none;
            }

            ::selection {
                background: var(--tally);
                color: var(--text-primary);
            }

            :focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }

            ::-webkit-scrollbar-track {
                background: transparent;
            }

            ::-webkit-scrollbar-thumb {
                background: var(--border-strong);
                border-radius: 3px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #444444;
            }

            cheating-daddy-app {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <!--
        THESIS: Menace Agent is a talent autocue — setup in a black hooded board, then a compact prompter strip with ready-to-speak lines; refuses the neon glass AI-copilot dashboard.
        OWN-WORLD: Matte black (#0b0b0b) hood, cream-white type (#f7f7f2), red tally (#c41e3a), cream hairline bezels; opaque plates, no glass mush; system sans as prompter face.
        STORY: Candidate punches KEY + WHISPER + permissions, then reads short spoken answers while the call stays in front.
        FIRST VIEWPORT: Black hooded window; one large white line of instruction; KEY/WHISPER as edge plates; red tally START.
        FORM: Talent Autocue (newsroom teleprompter), pick card from seed 0b7f0015, Operate mode.
        FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
        -->
        <script src="assets/marked-4.3.0.min.js"></script>
        <script src="assets/highlight-11.9.0.min.js"></script>
        <link rel="stylesheet" href="assets/highlight-vscode-dark.min.css" />
        <script type="module" src="components/app/CheatingDaddyApp.js"></script>

        <cheating-daddy-app id="cheatingDaddy"></cheating-daddy-app>
        <script src="utils/renderer.js"></script>
    </body>
</html>
